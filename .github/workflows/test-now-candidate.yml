name: Test NOW Candidate

on:
  push:
    paths:
      - ".github/workflows/test-now-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-now:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test NOW alternate
        shell: bash
        run: |
          URL="https://streams.uzunmuhalefet.com/stream/f9368c57-16e5-44a2-a559-46377a476b04.m3u8"
          echo "HTTP:"
          curl -L -A "Mozilla/5.0" --connect-timeout 5 --max-time 15 -fsSI "$URL" | head -20 || true
          echo "PROBE:"
          timeout 20 ffprobe -v error -user_agent "Mozilla/5.0" -show_entries stream=codec_type,codec_name,width,height -of csv=p=0 "$URL" || true
          echo "PLAY20:"
          timeout 35 ffmpeg -hide_banner -loglevel error -user_agent "Mozilla/5.0" -t 20 -i "$URL" -map 0:v:0? -map 0:a:0? -f null -
